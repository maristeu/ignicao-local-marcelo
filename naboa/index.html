<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experimente o ápice do San Blas Sailing. Aluguel de veleiro exclusivo em San Blas, Panamá, com atendimento premium em português e alta gastronomia a bordo.">
    <meta name="keywords" content="San Blas sailing, navegação em San Blas, veleiro no Panamá, tour de veleiro San Blas, San Blas para brasileiros">
    <title>San Blas Sailing | Experiência Exclusiva de Veleiro no Panamá</title>
    
    <!-- Google Fonts: Playfair Display para títulos luxuosos e Inter para leitura fluida -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0A192F; /* Azul Marinho Profundo / Noite */
            --accent: #C5A880;  /* Dourado Champagne Muted */
            --accent-hover: #B3966E;
            --bg-light: #F9F9F6; /* Off-White suave */
            --bg-dark: #071120;
            --text-dark: #1C232D;
            --text-light: #F9F9F6;
            --text-muted: #64748B;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- UI UTILITIES --- */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .btn-premium {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent);
            color: var(--primary);
            text-decoration: none;
            padding: 1.25rem 2.5rem;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid var(--accent);
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-premium:hover {
            background-color: transparent;
            color: var(--accent);
            transform: translateY(-2px);
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 2.75rem;
            color: var(--primary);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .section-subtitle {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: block;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 2rem 0;
            border-bottom: 1px solid rgba(249, 249, 246, 0.1);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            color: var(--text-light);
            font-size: 1.75rem;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .logo span {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            display: block;
            letter-spacing: 0.3em;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: var(--text-light);
            /* REQUISITO SEO: Background escurecido por overlay para contraste de leitura */
            background: linear-gradient(rgba(7, 17, 32, 0.6), rgba(7, 17, 32, 0.75)), 
                        url('https://unsplash.com') no-repeat center center/cover;
        }

        .hero-content {
            max-width: 650px;
            padding-top: 4rem;
        }

        /* SEO PRINCIPAL: H1 com as palavras-chave vitais */
        .hero-content h1 {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .hero-content p {
            font-size: 1.15rem;
            font-weight: 300;
            color: rgba(249, 249, 246, 0.85);
            margin-bottom: 2.5rem;
        }

        /* --- INTRO / PROVENANCE --- */
        .intro {
            padding: 8rem 0;
            background-color: var(--bg-light);
        }

        .grid-intro {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .intro-text p {
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .intro-text p strong {
            font-weight: 500;
            color: var(--primary);
        }

        .intro-image {
            position: relative;
        }

        .intro-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-left: 4px solid var(--accent);
        }

        /* --- EXPERIENCES (O QUE INCLUI) --- */
        .experiences {
            padding: 8rem 0;
            background-color: var(--primary);
            color: var(--text-light);
        }

        .experiences .section-title {
            color: var(--text-light);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 4rem;
        }

        .card {
            background-color: var(--bg-dark);
            padding: 3rem 2rem;
            border: 1px solid rgba(197, 168, 128, 0.1);
            transition: var(--transition);
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .card-icon {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            display: block;
        }

        .card h3 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 0.95rem;
            color: rgba(249, 249, 246, 0.7);
            font-weight: 300;
        }

        /* --- REVIEWS / PROVA SOCIAL --- */
        .reviews {
            padding: 8rem 0;
            background-color: var(--bg-light);
        }

        .grid-reviews {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 3.5rem;
        }

        .review-box {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 2px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stars {
            color: var(--accent);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .review-text {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .review-author {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
        }

        /* --- CTA CONVERSION SECTION --- */
        .cta-section {
            padding: 10rem 0;
            background: linear-gradient(rgba(7, 17, 32, 0.85), rgba(7, 17, 32, 0.9)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            text-align: center;
            color: var(--text-light);
        }

        .cta-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .cta-content h2 {
            font-family: var(--font-serif);
            font-size: 3.25rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .cta-content p {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(249, 249, 246, 0.8);
            margin-bottom: 3rem;
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--bg-dark);
            color: rgba(249, 249, 246, 0.5);
            padding: 3rem 0;
            font-size: 0.85rem;
            border-top: 1px solid rgba(197, 168, 128, 0.05);
        }

        footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
